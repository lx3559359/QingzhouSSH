[package]
name = "qingzhou-ssh"
version = "0.1.0"
edition = "2021"

[lib]
name = "qingzhou_ssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomicwrites = "0.4"
base64 = "0.22"
russh = { version = "0.62.4", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-updater = "2.10.1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows-dpapi = "0.2"
winreg = "0.56"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
